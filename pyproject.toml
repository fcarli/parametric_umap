[project]
name = "parametric-umap"
version = "0.1.1"
description = "A streamlined and fast implementation of parametric UMAP using PyTorch and FAISS"
authors = [
    {name = "Francesco Carli",email = "francesco.carli94@gmail.com"}
]
license = {text = "BSD License"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy (>=2.2.3,<3.0.0)",
    "scipy (>=1.15.2,<2.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "faiss-cpu (>=1.10.0,<2.0.0)",
    "torch (>=2.3.1,<3.0.0)",
]

[project.urls]
Homepage = "https://github.com/fcarli/parametric_umap"
Repository = "https://github.com/fcarli/parametric_umap"
Issues = "https://github.com/fcarli/parametric_umap/issues"
Changelog = "https://github.com/fcarli/parametric_umap/blob/main/CHANGELOG.md"

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "ruff>=0.9.9",
    "pre-commit>=4.0.0",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
]
examples = [
    "scikit-learn>=1.6.1",
    "matplotlib>=3.10.1",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-mock>=3.14.0",
    "hypothesis>=6.100.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Style rules that conflict with project conventions
    "COM812",  # Trailing comma conflicts with ruff formatter
    "D203",    # Conflicts with D211 (no-blank-line-before-class)
    "D213",    # Conflicts with D212 (multi-line-summary-first-line)

    # Rules too strict for ML/scientific computing
    "N803",    # Argument name should be lowercase (X, Z are standard ML notation)
    "N806",    # Variable name should be lowercase (same reason)
    "FBT",     # Boolean positional/default arguments (common for ML config params)
    "PLR0913", # Too many function arguments (ML models naturally have many params)
    "PLR2004", # Magic values in comparisons (common in tests and ML code)

    # Annotation rules (separate effort)
    "ANN",     # Type annotations not yet complete across codebase

    # Exception message style (too strict)
    "TRY003",  # Long exception messages
    "EM101",   # Exception string literals

    # Readability preferences (keep explicit names before return)
    "RET504",  # Unnecessary assignment before return
    "SIM108",  # Ternary operator (if/else blocks often clearer)

    # Noise for this project
    "NPY002",  # Legacy numpy.random (works fine, large refactor to change)
    "W505",    # Doc line too long (already have 120 char line length)
    "INP001",  # Missing __init__.py (false positives for examples dir)
    "T201",    # Print statements (used in examples and verbose output)
    "ERA001",  # Commented-out code (false positives on descriptive comments)
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link in TODO
    "FIX002",  # Line contains TODO
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 90

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SLF001", "ARG", "PT006", "PT012", "PLC0415"]
"parametric_umap/datasets/covariates_datasets.py" = ["SLF001"]  # torch sparse _nnz() has no public API

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=parametric_umap",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=30",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
upload_to_pypi = true
upload_to_release = true
build_command = "uv build"
dist_path = "dist/"
remove_dist = false
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
